name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test maintenance scripts
        run: python3 -m unittest scripts/test_package_release.py scripts/test_line_budget.py scripts/test_pr_admission.py
      - name: Enforce line budget
        run: python3 scripts/line_budget.py
      - name: Validate Cargo packages
        run: cargo package --workspace --locked --no-verify

  admission:
    name: Check PR admission
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate completed six-question template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_admission.py

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --release --locked -p mini-agent-cli
      - name: Smoke test release binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin=target/release/mini-agent.exe
          else
            bin=target/release/mini-agent
          fi
          "$bin" --version
          "$bin" --help

  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Check all targets with locked dependencies
        run: cargo check --workspace --all-targets --locked
