name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test maintenance scripts
        run: python3 -m unittest scripts/test_package_release.py scripts/test_line_budget.py scripts/test_pr_admission.py scripts/test_cargo_boundary.py
      - name: Enforce line budget
        run: python3 scripts/line_budget.py
      - name: Enforce line-budget delta on pull requests
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/line_budget.py
          --base "${{ github.event.pull_request.base.sha }}"
          --check-delta
          --json
      - name: Check Cargo dependency direction
        run: python3 scripts/cargo_boundary.py --json
      - name: Check Python SDK version and protocol contract
        run: python3 scripts/check_sdk_version.py
      - name: Validate Cargo packages
        run: cargo package --workspace --locked --no-verify

  admission:
    name: Check PR admission
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate completed six-question template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_admission.py

  python-sdk:
    name: Python SDK and Cookbook (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install SDK development dependencies
        run: uv sync --project sdk/python --locked --group dev
      - name: Lint SDK and Cookbook
        run: |
          uv run --project sdk/python --locked ruff check sdk/python/src sdk/python/tests cookbook/python-demo
          uv run --project sdk/python --locked ruff format --check sdk/python/src sdk/python/tests cookbook/python-demo
      - name: Test SDK and Cookbook
        run: uv run --project sdk/python --locked pytest sdk/python/tests -q

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --release --locked -p mini-agent-cli
      - name: Smoke test release binary
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bin=target/release/mini-agent.exe
          else
            bin=target/release/mini-agent
          fi
          "$bin" --version
          "$bin" --help

  msrv:
    name: Minimum Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.120.0
      - name: Check all targets with locked dependencies
        run: cargo check --workspace --all-targets --locked
