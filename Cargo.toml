[workspace]
members = [
    "crates/mini-agent-app-server",
    "crates/mini-agent-capabilities",
    "crates/mini-agent-host",
    "crates/mini-agent-app-server-protocol",
    "crates/mini-agent-protocol",
    "crates/mini-agent-core",
    "crates/mini-agent-cli",
]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A small native coding-agent harness with bounded tools and OpenAI Responses support"
readme = "README.md"
repository = "https://github.com/civaapple-alt/mini-agent-harness"
homepage = "https://github.com/civaapple-alt/mini-agent-harness"
keywords = ["ai", "agent", "coding", "cli", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
eventsource-stream = "0.2"
futures-util = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest", "which-command"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "rt", "sync", "time"] }
yaml_serde = "0.10.7"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
